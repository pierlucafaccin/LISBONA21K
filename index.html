<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lisbona 21K">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<title>Lisbona 21K</title>
<style>
  :root{
    /* night palette — evening running, scoreboard legibility */
    --bg:#0E1218;
    --surface:#161C25;
    --raised:#1E2733;
    --hairline:#2A3542;
    --text:#EAEEF4;
    --dim:#8B97A8;
    --faint:#5D6878;

    /* intensity ramp — used semantically, never decoratively */
    --z-rec:#4A6FA5;
    --z-easy:#4E8FC4;
    --z-mar:#3FA89B;
    --z-thr:#E0A23C;
    --z-int:#DC6B45;
    --z-race:#D94F3D;
    --z-rest:#4C5666;

    --ok:#4FA87C;
    --warn:#E0A23C;
    --bad:#DC6B45;

    --r:14px;
    --r-sm:9px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;

    --tabh:58px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

  /* ---------- shell ---------- */
  .screen{
    display:none;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px
            calc(env(safe-area-inset-bottom,0px) + var(--tabh) + 22px);
    min-height:100%;
  }
  .screen.on{display:block;}

  .head{margin-bottom:18px;}
  .head .kicker{font-size:13px;color:var(--dim);margin:0 0 2px;}
  .head h1{
    font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;
  }

  /* ---------- tab bar ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:grid;grid-template-columns:repeat(3,1fr);
    background:rgba(14,18,24,.92);
    backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-top:1px solid var(--hairline);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  nav.tabs button{
    appearance:none;background:none;border:0;cursor:pointer;
    height:var(--tabh);
    color:var(--faint);
    font-family:var(--sans);font-size:11px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;}
  nav.tabs button[aria-selected="true"]{color:var(--text);}
  nav.tabs button:focus-visible{outline:2px solid var(--z-easy);outline-offset:-3px;}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;}
  .card.flush{padding:0;overflow:hidden;}

  /* ---------- today hero ---------- */
  .sesh{position:relative;background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
  .sesh .stripe{height:3px;background:var(--z-rest);}
  .sesh .body{padding:18px 16px 16px;}
  .sesh .type{font-size:12px;font-weight:700;color:var(--dim);margin:0 0 6px;}
  .sesh h2{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:0 0 14px;}
  .sesh .figs{display:flex;gap:26px;margin-bottom:4px;}
  .fig .v{display:block;font-size:27px;font-weight:700;line-height:1;}
  .fig .l{display:block;font-size:11px;color:var(--dim);margin-top:4px;}

  .steps{list-style:none;margin:14px 0 0;padding:0;}
  .steps li{
    position:relative;padding:0 0 0 16px;margin-bottom:8px;
    font-size:14.5px;color:#C8D1DC;line-height:1.5;
  }
  .steps li::before{
    content:"";position:absolute;left:0;top:.62em;
    width:5px;height:5px;border-radius:50%;background:var(--faint);
  }
  .steps li:last-child{margin-bottom:0;}

  /* ---------- pace ladder (signature) ---------- */
  .ladder{margin:4px 0 12px;}
  .ladder .lbl{font-size:12px;color:var(--dim);margin-bottom:9px;}
  .rung{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:10px;padding:5px 0;}
  .rung .nm{font-size:13px;color:var(--dim);}
  .rung .bar{height:7px;border-radius:4px;background:var(--hairline);position:relative;overflow:hidden;}
  .rung .bar i{position:absolute;inset:0;border-radius:4px;}
  .rung .pv{font-size:13.5px;font-weight:600;text-align:right;color:#C8D1DC;}
  .rung.hit .nm,.rung.hit .pv{color:var(--text);font-weight:700;}

  /* ---------- log form ---------- */
  .log{border-top:1px solid var(--hairline);margin-top:16px;padding-top:16px;}
  .log h3{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 12px;}
  .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .f label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;}
  .f input,.log textarea{
    width:100%;background:var(--raised);border:1px solid var(--hairline);
    color:var(--text);border-radius:var(--r-sm);
    padding:11px 10px;font-family:var(--sans);font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .log textarea{margin-top:9px;font-size:15px;resize:vertical;min-height:44px;}
  .f input:focus,.log textarea:focus{outline:none;border-color:var(--z-easy);}
  .btn{
    appearance:none;border:0;border-radius:var(--r-sm);cursor:pointer;
    font-family:var(--sans);font-size:15px;font-weight:600;
    padding:13px 16px;background:var(--raised);color:var(--text);
  }
  .btn.wide{width:100%;margin-top:11px;}
  .btn.go{background:var(--z-easy);color:#08121C;}
  .btn.sm{font-size:13px;padding:9px 13px;}
  .btn:active{transform:scale(.99);}
  .btn:focus-visible{outline:2px solid var(--z-easy);outline-offset:2px;}

  .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .flag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;}
  .flag.ok{background:rgba(79,168,124,.16);color:var(--ok);}
  .flag.warn{background:rgba(224,162,60,.16);color:var(--warn);}
  .flag.bad{background:rgba(220,107,69,.16);color:var(--bad);}
  .flag.info{background:rgba(78,143,196,.16);color:var(--z-easy);}

  .done{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px;}
  .done input{width:21px;height:21px;accent-color:var(--ok);}

  /* ---------- week navigator ---------- */
  .wknav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .wknav button{
    appearance:none;border:1px solid var(--hairline);background:var(--surface);
    color:var(--text);width:38px;height:38px;border-radius:var(--r-sm);
    font-size:17px;cursor:pointer;flex:0 0 auto;
  }
  .wknav button:disabled{opacity:.3;}
  .wknav .mid{flex:1 1 auto;text-align:center;}
  .wknav .mid b{display:block;font-size:15px;font-weight:700;}
  .wknav .mid span{display:block;font-size:12px;color:var(--dim);}

  .wkmeta{display:flex;gap:18px;margin-bottom:10px;padding:0 2px;}
  .wkmeta div{font-size:12px;color:var(--dim);}
  .wkmeta b{color:var(--text);font-weight:700;font-size:15px;display:block;}

  .note{
    font-size:13.5px;color:#B3BECB;line-height:1.5;
    background:var(--surface);border-radius:var(--r);padding:13px 14px;margin-bottom:12px;
    border-left:3px solid var(--z-mar);
  }

  /* ---------- day rows ---------- */
  .days{background:var(--surface);border-radius:var(--r);overflow:hidden;}
  .day{border-bottom:1px solid var(--hairline);}
  .day:last-child{border-bottom:0;}
  .day > button{
    appearance:none;background:none;border:0;width:100%;cursor:pointer;
    display:grid;grid-template-columns:44px 3px 1fr auto;gap:11px;align-items:center;
    padding:13px 14px;text-align:left;font-family:var(--sans);color:var(--text);
  }
  .day .dow{font-size:11px;color:var(--faint);line-height:1.25;}
  .day .dow b{display:block;font-size:16px;font-weight:700;color:var(--dim);}
  .day.today .dow b{color:var(--z-thr);}
  .day .tick{width:3px;height:30px;border-radius:2px;background:var(--z-rest);}
  .day .t{font-size:14.5px;font-weight:600;line-height:1.3;}
  .day .s{font-size:12px;color:var(--dim);margin-top:2px;}
  .day .chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hairline);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;}
  .day.did .chk{background:var(--ok);border-color:var(--ok);color:#08121C;}
  .day .panel{display:none;padding:0 14px 15px 72px;}
  .day.open .panel{display:block;}
  .day .panel .steps li{font-size:13.5px;}

  /* ---------- charts ---------- */
  .chart{margin-bottom:12px;}
  .chart h3{font-size:14px;font-weight:700;margin:0 0 3px;}
  .chart p{font-size:12.5px;color:var(--dim);margin:0 0 12px;line-height:1.45;}
  .chart svg{width:100%;height:auto;display:block;overflow:visible;}
  .ckey{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .ckey span{font-size:11.5px;color:var(--dim);display:inline-flex;align-items:center;gap:5px;}
  .ckey i{width:9px;height:3px;border-radius:2px;}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
  .tile{background:var(--surface);border-radius:var(--r);padding:14px;}
  .tile .v{font-size:25px;font-weight:700;line-height:1;}
  .tile .l{font-size:11.5px;color:var(--dim);margin-top:5px;}

  .empty{background:var(--surface);border-radius:var(--r);padding:26px 18px;text-align:center;}
  .empty p{margin:0;font-size:14px;color:var(--dim);line-height:1.5;}
  .hint{font-size:12.5px;color:var(--dim);margin:-4px 0 11px;line-height:1.45;}
  .fields.xf{margin-bottom:9px;}
  .f.wide{grid-column:1/-1;}
  .res{margin-top:12px;font-size:13.5px;line-height:1.5;color:#C8D1DC;background:var(--raised);
       border-radius:var(--r-sm);padding:11px 12px;border-left:3px solid #E5CF4A;}
  .res b{color:var(--text);}
  .state{padding:18px 16px;}
  .state .sk{font-size:12px;color:var(--dim);margin:0 0 4px;}
  .state .big{font-size:42px;font-weight:700;line-height:1;letter-spacing:-.03em;}
  .state .sub{font-size:13px;color:var(--dim);margin:6px 0 12px;}
  .state .goal{font-size:14px;margin:0;line-height:1.5;color:#C8D1DC;}
  .state .goal b{color:var(--z-thr);}
  .state .next{font-size:13px;color:var(--dim);margin:10px 0 0;padding-top:10px;border-top:1px solid var(--hairline);}
  .state .next b{color:var(--text);font-weight:600;}

  /* ---------- sheet ---------- */
  .sheet{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:flex-end;background:rgba(6,9,13,.6);
  }
  .sheet.on{display:flex;}
  .sheet .inner{
    width:100%;background:var(--surface);
    border-radius:18px 18px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{margin:0 0 6px;font-size:17px;font-weight:700;}
  .sheet p{font-size:13.5px;color:var(--dim);margin:0 0 12px;line-height:1.5;}
  .sheet textarea{
    width:100%;min-height:110px;background:var(--raised);color:var(--text);
    border:1px solid var(--hairline);border-radius:var(--r-sm);padding:11px;
    font-size:13px;font-family:ui-monospace,Menlo,monospace;
  }
  .sheet .row{display:flex;gap:9px;margin-top:12px;}
  .sheet .row .btn{flex:1 1 0;}
  .msg{font-size:12.5px;min-height:17px;margin-top:9px;}

  .gear{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;
    appearance:none;background:var(--surface);border:1px solid var(--hairline);
    width:36px;height:36px;border-radius:50%;color:var(--dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

<script>
/* storage: window.storage dentro Claude, altrimenti localStorage */
(function(){
  if (window.storage && typeof window.storage.get === 'function') return;
  var K='verona21k:training-log', mem={}, ok=(function(){
    try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}
  })();
  window.storage={
    get:function(k){return new Promise(function(res,rej){
      var v=ok?localStorage.getItem(K):(k in mem?mem[k]:null);
      if(v===null||v===undefined)rej(new Error('not found'));else res({key:k,value:v});});},
    set:function(k,v){return new Promise(function(res,rej){
      try{ok?localStorage.setItem(K,v):(mem[k]=v);res({key:k,value:v});}catch(e){rej(e);}});},
    delete:function(k){return new Promise(function(res){
      ok?localStorage.removeItem(K):delete mem[k];res({key:k,deleted:true});});},
    list:function(){return Promise.resolve({keys:[]});}
  };
  if(!ok)console.warn('localStorage non disponibile: i dati non verranno salvati.');
})();
</script>

<script>
(function(){
  "use strict";

  const DAY_KEYS=['mon','tue','wed','thu','fri','sat','sun'];
  const DOW=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const MONTHS=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

  const TYPE={
    recupero:{lbl:'Recupero',c:'var(--z-rec)'},
    facile:  {lbl:'Facile',  c:'var(--z-easy)'},
    lungo:   {lbl:'Lungo',   c:'var(--z-mar)'},
    ritmo:   {lbl:'Soglia',  c:'var(--z-thr)'},
    ripetute:{lbl:'VO2max',  c:'var(--z-int)'},
    test:    {lbl:'Test',    c:'#E5CF4A'},
    gara:    {lbl:'Gara',    c:'var(--z-race)'},
    riposo:  {lbl:'Riposo',  c:'var(--z-rest)'},
    padel:   {lbl:'Padel',   c:'#9A82D4'}
  };

  /* ═══════════ fisiologia: formule di Daniels–Gilbert ═══════════
     VO2 richiesto a velocità v (m/min) e % del VO2max sostenibile
     per una durata t (min). Il VDOT è il loro rapporto. */
  const vo2=v=>-4.60+0.182258*v+0.000104*v*v;
  const pctMax=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
  const vdotFrom=(m,sec)=>{const t=sec/60;return vo2(m/t)/pctMax(t);};
  const vAt=vo=>{const a=0.000104,b=0.182258,c=-4.60-vo;return (-b+Math.sqrt(b*b-4*a*c))/(2*a);};
  const paceFrac=(vd,f)=>60000/vAt(vd*f);           // s/km
  function predict(vd,m){                            // secondi su distanza m
    let lo=m/450*60, hi=m/90*60;
    for(let i=0;i<70;i++){const mid=(lo+hi)/2; if(vdotFrom(m,mid)>vd)lo=mid; else hi=mid;}
    return (lo+hi)/2;
  }

  const HR_MAX=190;
  const RACE_M=21097.5;
  const GOAL_SEC=100*60;                              // 1:40:00
  const BASE={vd:vdotFrom(RACE_M,6646),src:"mezza M6C del 20 settembre (1:50:46)"};

  /* ═══════════ tempo e ritmo ═══════════ */
  const pad=n=>String(n).padStart(2,'0');
  const fmtPace=s=>{s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60);};
  const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x);};

  function normPace(v){
    const t=String(v==null?'':v).trim(); if(!t)return null;
    let m=/^(\d{1,2})[:.,](\d{2})$/.exec(t);
    if(!m){const d=t.replace(/\D/g,'');if(d.length===3||d.length===4)m=[d,d.slice(0,-2),d.slice(-2)];}
    if(!m||+m[2]>59)return null;
    return (+m[1])+':'+m[2];
  }
  const p2s=s=>{const n=normPace(s);if(!n)return null;const q=n.split(':');return +q[0]*60+ +q[1];};

  function normTime(v){
    const t=String(v==null?'':v).trim(); if(!t)return null;
    let p;
    if(/[:.,]/.test(t))p=t.split(/[:.,]/).map(x=>x.trim());
    else{const d=t.replace(/\D/g,'');if(d.length<3||d.length>6)return null;
      p=d.length<=4?[d.slice(0,-2),d.slice(-2)]:[d.slice(0,-4),d.slice(-4,-2),d.slice(-2)];}
    if(p.some(x=>!/^\d+$/.test(x)))return null;
    const n=p.map(Number);
    if(n.length===2&&n[1]<60)return n[0]+':'+pad(n[1]);
    if(n.length===3&&n[1]<60&&n[2]<60)return n[0]+':'+pad(n[1])+':'+pad(n[2]);
    return null;
  }
  const tSec=v=>{const n=normTime(v);if(!n)return null;const p=n.split(':').map(Number);return p.length===2?p[0]*60+p[1]:p[0]*3600+p[1]*60+p[2];};

  /* ═══════════ zone: andature dal VDOT, FC dalla soglia ═══════════ */

      if(t==='vam7'&&d.tdist){st.vam=d.tdist/420*3.6;st.vamSrc='test del '+when;}

    const a=p2s(p[0]),b=p2s(p[1]); return (a==null||b==null)?null:[a,b];
  }
  function hrRng(str){

    if(changed)await save();
  }

    const all=LADDER.map(r=>rng(Z[r[1]])).filter(Boolean);

    if(e.test==='vam7'&&d.tdist){
      const vam=d.tdist/420*3.6, idx=(RACE_M/Z.hm*3.6)/vam*100;
      t='VAM <b>'+vam.toFixed(1)+' km/h</b> ('+fmtPace(3600/vam)+'/km) · la mezza prevista è al <b>'+idx.toFixed(0)+'%</b> della VAM';
    }
    if(e.test==='thr30'&&d.thr) t='Soglia a <b>'+d.thr+' bpm</b>. Tutte le zone di FC sono ricalcolate su questo valore.';
    if(e.test==='drift'&&d.h1&&d.h2){
      const p=(d.h2-d.h1)/d.h1*100;
      t='Deriva <b>'+p.toFixed(1)+'%</b>: '+(p<5?'base aerobica solida.':'la tenuta aerobica ha ancora margine.');
    }
    if(e.test==='hrfix'&&p2s(d.pace)!=null){
      const i=ST.hrfix.findIndex(x=>x.k===e._k);
      if(i>0){const diff=ST.hrfix[i-1].s-ST.hrfix[i].s;
        t='A 145 bpm: <b>'+d.pace+'/km</b>, '+(diff>=0?diff+' s/km più veloce':(-diff)+' s/km più lento')+' del test precedente.';}
      else t='A 145 bpm: <b>'+d.pace+'/km</b>. È il punto di partenza: il prossimo test dirà quanto sei migliorato.';
    }
    return t?'<div class="res">'+t+'</div>':'';
  }

  /* ═══════════ OGGI ═══════════ */
  function renderToday(){
    const box=document.getElementById('todayBody');
    const now=new Date(), k=iso(now), info=MAP[k];
    document.getElementById('todayDate').textContent=DOW[(now.getDay()+6)%7]+' '+fmt(now)+' '+now.getFullYear();

    if(!info){
      const before=now<PLAN_START;
      document.getElementById('todayPhase').textContent=before?'Si parte presto':'Blocco concluso';
      box.innerHTML='<div class="empty"><p>'+(before?'Il blocco verso Lisbona comincia lunedì 5 ottobre.':'Lisbona è alle spalle.')+
        '</p></div>'+ladderHtml(null);
      return;
    }
    const e=Object.assign({_k:k},info.entry), t=TYPE[e.type]||TYPE.riposo, d=log[k]||{};
    document.getElementById('todayPhase').textContent='Sett. '+(info.week+1)+' · '+WEEK_TEMPLATES[info.week].phase;

    let h='<div class="sesh"><div class="stripe" style="background:'+t.c+'"></div><div class="body">';
    h+='<p class="type" style="color:'+t.c+'">'+t.lbl+(e.tag&&e.tag!==t.lbl?' · '+e.tag:'')+'</p>';
    h+='<h2>'+R(e.title)+'</h2>';
    if(e.km)h+='<div class="figs"><div class="fig"><span class="v num">'+e.km+'</span><span class="l">km previsti</span></div></div>';
    h+='<ul class="steps">'+e.detail.map(x=>'<li>'+R(x)+'</li>').join('')+'</ul>';

    h+='<div class="log"><h3>Com\u2019è andata</h3>';
    if(e.type==='ritmo'||e.type==='ripetute')
      h+='<p class="hint">Ritmo e FC della parte centrale (soglia o ripetute), non la media di tutta l\u2019uscita.</p>';
    if(e.test==='hrfix')
      h+='<p class="hint">Ritmo = media dei 5 km a FC fissa.</p>';

    // campi specifici del test
    let x='';
    if(e.test==='tt5k'||e.test==='tt10k')
      x='<div class="f wide"><label for="xTime">tempo dei '+(e.test==='tt5k'?'5':'10')+' km</label><input id="xTime" type="text" inputmode="numeric" placeholder="'+(e.test==='tt5k'?'22:30':'47:30')+'" value="'+(d.ttime||'')+'"></div>';
    if(e.test==='vam7')
      x='<div class="f wide"><label for="xDist">metri percorsi in 7\'</label><input id="xDist" type="text" inputmode="numeric" placeholder="1500" value="'+(d.tdist||'')+'"></div>';
    if(e.test==='thr30')
      x='<div class="f wide"><label for="xThr">FC media ultimi 20\'</label><input id="xThr" type="text" inputmode="numeric" placeholder="172" value="'+(d.thr||'')+'"></div>';
    if(e.test==='drift')
      x='<div class="f"><label for="xH1">FC 1ª metà</label><input id="xH1" type="text" inputmode="numeric" value="'+(d.h1||'')+'"></div>'+
        '<div class="f"><label for="xH2">FC 2ª metà</label><input id="xH2" type="text" inputmode="numeric" value="'+(d.h2||'')+'"></div>';
    if(x)h+='<div class="fields xf">'+x+'</div>';

    h+='<div class="fields">'+
      '<div class="f"><label for="iKm">km</label><input id="iKm" type="text" inputmode="decimal" value="'+(d.km!=null?d.km:'')+'"></div>'+
      '<div class="f"><label for="iPace">ritmo</label><input id="iPace" type="text" inputmode="numeric" placeholder="5:40" value="'+(d.pace||'')+'"></div>'+
      '<div class="f"><label for="iHr">FC media</label><input id="iHr" type="text" inputmode="numeric" value="'+(d.hr!=null?d.hr:'')+'"></div>'+
      '</div><textarea id="iNote" placeholder="Note (facoltativo)">'+(d.note||'')+'</textarea>'+
      '<button class="btn go wide" id="bSave">Salva i dati</button><div class="msg" id="iMsg" style="color:var(--bad)"></div>';

    const fl=flags(e,hasData(d)?d:null);
    if(fl.length)h+='<div class="flags">'+fl.map(f=>'<span class="flag '+f[0]+'">'+f[1]+'</span>').join('')+'</div>';
    h+=testResult(e,d);
    h+='<label class="done"><input type="checkbox" id="cDone" '+(did(k)?'checked':'')+'> Seduta completata</label>';
    h+='</div></div></div>';
    h+=ladderHtml(e.type);
    box.innerHTML=h;

    const $=id=>document.getElementById(id);
    const digitsTime=el=>el.addEventListener('input',()=>{
      const d=el.value.replace(/\D/g,'').slice(0,6);
      el.value=d.length>=5?d.slice(0,-4)+':'+d.slice(-4,-2)+':'+d.slice(-2):d.length>=3?d.slice(0,-2)+':'+d.slice(-2):d;
    });
    const ip=$('iPace');
    ip.addEventListener('input',()=>{const d=ip.value.replace(/\D/g,'').slice(0,4);ip.value=d.length>=3?d.slice(0,-2)+':'+d.slice(-2):d;});
    if($('xTime'))digitsTime($('xTime'));

    $('bSave').onclick=()=>{
      const msg=$('iMsg'); msg.textContent='';
      const km=parseFloat(String($('iKm').value).replace(',','.'));
      const hr=parseInt($('iHr').value,10);
      const raw=$('iPace').value.trim(), pc=normPace(raw);
      if(raw&&!pc){msg.textContent='Ritmo non valido: scrivi minuti e secondi, per esempio 535 per 5:35.';ip.focus();return;}
      const f={km:isNaN(km)?null:km,pace:pc||null,hr:isNaN(hr)?null:hr,note:$('iNote').value.trim()||null};
      if($('xTime')){const r=$('xTime').value.trim(),n=normTime(r);
        if(r&&!n){msg.textContent='Tempo non valido: per esempio 2230 per 22:30, oppure 14512 per 1:45:12.';return;}
        f.ttime=n;}
      if($('xDist')){const v=parseInt($('xDist').value,10);
        if($('xDist').value.trim()&&(isNaN(v)||v<800||v>3000)){msg.textContent='Metri fuori scala: in 7\' ci si aspetta tra 800 e 3000.';return;}
        f.tdist=isNaN(v)?null:v;}
      if($('xThr')){const v=parseInt($('xThr').value,10);
        if($('xThr').value.trim()&&(isNaN(v)||v<120||v>HR_MAX)){msg.textContent='FC fuori scala.';return;}
        f.thr=isNaN(v)?null:v;}
      if($('xH1')){const a=parseInt($('xH1').value,10),b=parseInt($('xH2').value,10);f.h1=isNaN(a)?null:a;f.h2=isNaN(b)?null:b;}
      setData(k,f);
    };
    $('cDone').onchange=ev=>setDone(k,ev.target.checked);
  }

  /* ═══════════ PIANO ═══════════ */
  function renderPlan(){
    const wt=WEEK_TEMPLATES[curWeek];
    const start=addD(MON0,curWeek*7), end=addD(start,6);
    const keys=[];for(let i=0;i<7;i++)keys.push(iso(addD(start,i)));
    document.getElementById('wkName').textContent='Sett. '+(curWeek+1)+'/'+WEEK_TEMPLATES.length+' · '+wt.phase;
    document.getElementById('wkDates').textContent=start.getMonth()===end.getMonth()
      ? start.getDate()+'–'+end.getDate()+' '+MONTHS[start.getMonth()]
      : fmt(start)+' – '+fmt(end);
    let pk=0,ak=0,dn=0,tot=0;
    keys.forEach(k=>{
      const e=MAP[k].entry; pk+=e.km||0;
      if(e.type!=='riposo')tot++;
      if(log[k]&&log[k].km)ak+=log[k].km;
      if(did(k)&&e.type!=='riposo')dn++;
    });
    document.getElementById('wkPlanned').textContent=pk.toFixed(0);
    document.getElementById('wkActual').textContent=ak.toFixed(1);
    document.getElementById('wkDone').textContent=dn+'/'+tot;
    document.getElementById('wkNote').textContent=R(wt.note);
    document.getElementById('wkPrev').disabled=curWeek===0;
    document.getElementById('wkNext').disabled=curWeek===WEEK_TEMPLATES.length-1;

    const todayK=iso(new Date());
    const list=document.getElementById('dayList');
    list.innerHTML=keys.map((k,i)=>{
      const e=Object.assign({_k:k},MAP[k].entry),t=TYPE[e.type]||TYPE.riposo,d=log[k]||{};
      let sub=e.km?e.km+' km':'';
      if(e.tag==='Niente padel'||e.tag==='Padel libero'||e.tag==='Test')sub=(sub?sub+' · ':'')+e.tag;
      if(d.km!=null||d.pace||d.hr!=null){
        const r=[];
        if(d.km!=null)r.push(d.km+' km');
        if(d.pace)r.push(d.pace+'/km');
        if(d.hr!=null)r.push(d.hr+' bpm');
        sub=r.join(' · ');
      }
      const fl=flags(e,hasData(d)?d:null);
      return '<div class="day'+(did(k)?' did':'')+(k===todayK?' today':'')+(openDay===k?' open':'')+'" data-k="'+k+'">'+
        '<button type="button"><span class="dow">'+DOW[i]+'<b class="num">'+MAP[k].date.getDate()+'</b></span>'+
        '<span class="tick" style="background:'+t.c+'"></span>'+
        '<span><span class="t">'+R(e.title)+'</span><span class="s num">'+sub+'</span></span>'+
        '<span class="chk">✓</span></button>'+
        '<div class="panel"><ul class="steps">'+e.detail.map(x=>'<li>'+R(x)+'</li>').join('')+'</ul>'+
        (fl.length?'<div class="flags">'+fl.map(f=>'<span class="flag '+f[0]+'">'+f[1]+'</span>').join('')+'</div>':'')+
        testResult(e,d)+'</div></div>';
    }).join('');
    list.querySelectorAll('.day > button').forEach(b=>{
      b.onclick=()=>{const k=b.parentNode.dataset.k;openDay=openDay===k?null:k;renderPlan();};
    });
  }

  /* ═══════════ grafici ═══════════ */
  function svgLine(series,o){
    const W=328,H=o.h||120,L=34,Rr=8,T=10,B=22;
    const all=series.flatMap(s=>s.pts); if(!all.length)return '';
    let lo=Math.min(...all.map(p=>p.y)), hi=Math.max(...all.map(p=>p.y));
    if(lo===hi){lo-=1;hi+=1;}
    const py=(hi-lo)*.15; lo-=py; hi+=py;
    const nx=Math.max(1,o.n-1), X=i=>L+(i/nx)*(W-L-Rr), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
    let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.aria||'grafico')+'">';
    [0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f,y=Y(v);
      g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-Rr)+'" y2="'+y.toFixed(1)+'" stroke="#2A3542"/>';
      g+='<text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" fill="#5D6878" font-size="9.5" text-anchor="end" font-family="system-ui">'+o.fy(v)+'</text>';});
    series.forEach(s=>{
      if(s.pts.length===1){g+='<circle cx="'+X(s.pts[0].x).toFixed(1)+'" cy="'+Y(s.pts[0].y).toFixed(1)+'" r="3.4" fill="'+s.c+'"/>';return;}
      g+='<path d="'+s.pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')+'" fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      s.pts.forEach(p=>{g+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.6" fill="'+s.c+'"/>';});
    });
    (o.xl||[]).forEach(q=>{g+='<text x="'+X(q.x).toFixed(1)+'" y="'+(H-6)+'" fill="#5D6878" font-size="9.5" text-anchor="middle" font-family="system-ui">'+q.t+'</text>';});
    return g+'</svg>';
  }
  function svgBars(rows,o){
    const W=328,H=o.h||150,L=30,Rr=6,T=10,B=26;
    const hi=Math.max(...rows.map(r=>Math.max(r.a,r.b)),1);
    const n=rows.length, slot=(W-L-Rr)/n, bw=Math.max(2.5,Math.min(13,slot*.36));
    let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.aria||'grafico')+'">';
    [0,.5,1].forEach(f=>{const y=T+(1-f)*(H-T-B);
      g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-Rr)+'" y2="'+y.toFixed(1)+'" stroke="#2A3542"/>';
      g+='<text x="'+(L-5)+'" y="'+(y+3.5).toFixed(1)+'" fill="#5D6878" font-size="9.5" text-anchor="end" font-family="system-ui">'+Math.round(hi*f)+'</text>';});
    rows.forEach((r,i)=>{
      const cx=L+slot*(i+.5), ha=r.a/hi*(H-T-B), hb=r.b/hi*(H-T-B);
      g+='<rect x="'+(cx-bw-.8).toFixed(1)+'" y="'+(H-B-ha).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,ha).toFixed(1)+'" rx="1.5" fill="#2F3B4A"/>';
      g+='<rect x="'+(cx+.8).toFixed(1)+'" y="'+(H-B-hb).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,hb).toFixed(1)+'" rx="1.5" fill="var(--z-mar)"/>';
      if(r.lbl)g+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" fill="#5D6878" font-size="9.5" text-anchor="middle" font-family="system-ui">'+r.lbl+'</text>';
    });
    return g+'</svg>';
  }

  /* ═══════════ ANDAMENTO ═══════════ */
  function renderStats(){
    const box=document.getElementById('statsBody');
    const now=new Date(), todayK=iso(now);
    const daysTo=Math.max(0,Math.ceil((RACE_DATE-now)/864e5));
    document.getElementById('statsKicker').textContent=daysTo>0?daysTo+' giorni a Lisbona':'Giorno di gara';

    /* dove sei adesso */
    const gap=Z.rp-GOAL_SEC/21.0975;
    let h='<div class="card state"><p class="sk">Previsione per Lisbona</p>'+
      '<div class="big num">'+fmtDur(Z.hm)+'</div>'+
      '<p class="sub num">'+fmtPace(Z.rp)+'/km · da '+ST.vdSrc+'</p>'+
      '<p class="goal">'+(gap>0
        ? 'Per scendere sotto 1:40:00 servono 4:44/km: mancano <b class="num">'+Math.round(gap)+' secondi al km</b>.'
        : 'Sei sotto 1:40:00. 🎯')+'</p>';
    const next=ALL.find(k=>k>=todayK&&MAP[k].entry.test&&MAP[k].entry.test!=='rehearsal');
    if(next){const ne=MAP[next];h+='<p class="next">Prossimo test: <b>'+R(ne.entry.title)+'</b>, '+DOW[(ne.date.getDay()+6)%7].toLowerCase()+' '+fmt(ne.date)+'</p>';}
    h+='</div>';

    const idx=ST.vam?(RACE_M/Z.hm*3.6)/ST.vam*100:null;
    h+='<div class="tiles">'+
      '<div class="tile"><div class="v num">'+ST.vd.toFixed(1)+'</div><div class="l">VDOT</div></div>'+
      '<div class="tile"><div class="v num">'+Z.lthr+'</div><div class="l">soglia FC '+(ST.lthr?'(misurata)':'(stimata)')+'</div></div>'+
      '<div class="tile"><div class="v num">'+(ST.vam?ST.vam.toFixed(1):'—')+'</div><div class="l">VAM km/h'+(ST.vam?'':' · test il 1 dic')+'</div></div>'+
      '<div class="tile"><div class="v num">'+(idx?idx.toFixed(0)+'%':'—')+'</div><div class="l">mezza / VAM</div></div>'+
      '</div>';
    if(ST.drift)h+='<div class="note">Deriva cardiaca nel lungo del '+ST.drift.when+': <b>'+ST.drift.pct.toFixed(1)+'%</b>. '+(ST.drift.pct<5?'Base aerobica solida.':'C\'è ancora margine sulla tenuta.')+'</div>';

    /* FC fissa */
    if(ST.hrfix.length>=2){
      const n=ST.hrfix.length;
      h+='<div class="card chart"><h3>Ritmo a 145 bpm</h3><p>Il test più pulito che hai: stesse condizioni ogni volta. Se la linea scende, il motore aerobico sta migliorando.</p>'+
        svgLine([{pts:ST.hrfix.map((x,i)=>({x:i,y:x.s})),c:'var(--z-easy)'}],{n:n,h:120,fy:v=>fmtPace(v),
          xl:[{x:0,t:fmt(MAP[ST.hrfix[0].k].date)},{x:n-1,t:fmt(MAP[ST.hrfix[n-1].k].date)}],aria:'Ritmo a FC fissa'})+'</div>';
    }

    /* corse facili */
    const easy=ALL.filter(k=>{const t=MAP[k].entry.type;return (t==='facile'||t==='recupero'||t==='lungo')&&!MAP[k].entry.test&&log[k]&&p2s(log[k].pace)!=null;});
    if(easy.length>=2){
      const n=easy.length, xl=[{x:0,t:fmt(MAP[easy[0]].date)},{x:n-1,t:fmt(MAP[easy[n-1]].date)}];
      const withHr=easy.filter(k=>log[k].hr!=null&&!isNaN(log[k].hr));
      h+='<div class="card chart"><h3>Corse facili: ritmo e FC</h3><p>Solo facili e lunghi, dove lo sforzo è comparabile. Ritmo che scende a FC ferma = base che cresce.</p>'+
        svgLine([{pts:easy.map((k,i)=>({x:i,y:p2s(log[k].pace)})),c:'var(--z-thr)'}],{n:n,h:112,fy:fmtPace,xl:xl,aria:'Ritmo corse facili'})+
        (withHr.length>=2?svgLine([{pts:withHr.map(k=>({x:easy.indexOf(k),y:log[k].hr})),c:'var(--z-int)'}],{n:n,h:106,fy:v=>Math.round(v),xl:xl,aria:'FC corse facili'}):'')+
        '<div class="ckey"><span><i style="background:var(--z-thr)"></i>ritmo (più basso = più veloce)</span><span><i style="background:var(--z-int)"></i>FC media</span></div></div>';
    }

    /* volume */
    const rows=WEEK_TEMPLATES.map((wt,w)=>{
      let a=0,b=0;
      for(let i=0;i<7;i++){const k=iso(addD(MON0,w*7+i));a+=MAP[k].entry.km||0;b+=(log[k]&&log[k].km)||0;}
      return {lbl:w%3===0?'S'+(w+1):'',a,b};
    });
    h+='<div class="card chart"><h3>Volume settimanale</h3><p>Previsto a sinistra, corso a destra. Gli avvallamenti sono scarichi e settimane di test, non cali di forma.</p>'+
      svgBars(rows,{aria:'Km previsti e corsi per settimana'})+
      '<div class="ckey"><span><i style="background:#2F3B4A"></i>previsto</span><span><i style="background:var(--z-mar)"></i>corso</span></div></div>';

    /* distribuzione */
    const by={};
    ALL.forEach(k=>{const e=MAP[k].entry,km=(log[k]&&log[k].km)||0;if(!km||e.type==='riposo'||e.type==='padel')return;by[e.type]=(by[e.type]||0)+km;});
    const tk=Object.keys(by);
    if(tk.length){
      const tot=tk.reduce((s,k)=>s+by[k],0);
      h+='<div class="card chart"><h3>Come si distribuiscono i km</h3><p>La maggior parte deve stare su facile e lungo: lì si costruisce la base.</p>'+
        '<div style="display:flex;height:11px;border-radius:6px;overflow:hidden;margin-bottom:11px;">'+
        tk.sort((a,b)=>by[b]-by[a]).map(t=>'<i style="width:'+(by[t]/tot*100).toFixed(1)+'%;background:'+(TYPE[t]||TYPE.riposo).c+'"></i>').join('')+
        '</div><div class="ckey">'+tk.map(t=>'<span><i style="background:'+(TYPE[t]||TYPE.riposo).c+'"></i>'+(TYPE[t]||TYPE.riposo).lbl+' '+by[t].toFixed(0)+' km</span>').join('')+'</div></div>';
    }

    const realKm=ALL.reduce((s,k)=>s+((log[k]&&log[k].km)||0),0);
    h+='<div class="tiles">'+
      '<div class="tile"><div class="v num">'+realKm.toFixed(0)+'</div><div class="l">km corsi nel blocco</div></div>'+
      '<div class="tile"><div class="v num">'+PLAN_KM.toFixed(0)+'</div><div class="l">km previsti</div></div>'+
      '<div class="tile"><div class="v num">'+SESSIONS.filter(did).length+'/'+SESSIONS.length+'</div><div class="l">sedute fatte</div></div>'+
      '<div class="tile"><div class="v num">'+daysTo+'</div><div class="l">giorni alla gara</div></div></div>';
    box.innerHTML=h;
  }

  /* ═══════════ impostazioni: esporta / importa / azzera ═══════════ */

  function openSheet(){

    document.getElementById('shMain').innerHTML=
      '<div class="row"><button class="btn sm" id="sExp">Esporta</button><button class="btn sm" id="sImp">Importa</button><button class="btn sm" id="sRst">Azzera</button></div>'+
      '<div id="sArea" style="margin-top:12px;"></div>';
    document.getElementById('sExp').onclick=()=>{
      document.getElementById('sArea').innerHTML='<p>Copia questo testo e conservalo: serve per rimettere i dati su un altro dispositivo.</p><textarea id="sTa" readonly></textarea>';
      document.getElementById('sTa').value=JSON.stringify({log,exportedAt:iso(new Date())});
      document.getElementById('sTa').select();
    };
    document.getElementById('sImp').onclick=()=>{
      document.getElementById('sArea').innerHTML='<p>Incolla qui il testo esportato in precedenza.</p><textarea id="sTa"></textarea><button class="btn go wide" id="sDo">Importa i dati</button>';
      document.getElementById('sDo').onclick=async()=>{
        const m=document.getElementById('shMsg');
        try{const p=JSON.parse(document.getElementById('sTa').value.trim());
          if(p.log&&typeof p.log==='object')log=p.log; else throw new Error('bad');
          await save();renderAll();m.style.color='var(--ok)';m.textContent='Dati importati.';}
        catch(e){m.style.color='var(--bad)';m.textContent='Testo non valido: controlla di aver incollato tutto.';}
      };
    };
    document.getElementById('sRst').onclick=async()=>{
      if(!confirm('Azzerare tutti i dati registrati?'))return;
      log={};try{await window.storage.delete('training-log',false);}catch(e){}
      renderAll();const m=document.getElementById('shMsg');m.style.color='var(--dim)';m.textContent='Diario azzerato.';
    };
    sheet.classList.add('on');
  }
  document.getElementById('gear').onclick=openSheet;
  document.getElementById('shClose').onclick=()=>sheet.classList.remove('on');
  sheet.onclick=ev=>{if(ev.target===sheet)sheet.classList.remove('on');};

  const tabs=[...document.querySelectorAll('nav.tabs button')];
  tabs.forEach(b=>{b.onclick=()=>{
    tabs.forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    ['today','plan','stats'].forEach(s=>document.getElementById('scr-'+s).classList.toggle('on',s===b.dataset.scr));
    try{window.scrollTo(0,0);}catch(e){}
  };});
  document.getElementById('wkPrev').onclick=()=>{if(curWeek>0){curWeek--;openDay=null;renderPlan();}};
  document.getElementById('wkNext').onclick=()=>{if(curWeek<WEEK_TEMPLATES.length-1){curWeek++;openDay=null;renderPlan();}};

  function renderAll(){recompute();renderToday();renderPlan();renderStats();}

  (async function init(){
    await load();
    const k=iso(new Date());
    if(MAP[k])curWeek=MAP[k].week;
    else if(new Date()>RACE_DATE)curWeek=WEEK_TEMPLATES.length-1;
    renderAll();
  })();
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('SW',e);});
  });
}
</script>
</body>
</html>
